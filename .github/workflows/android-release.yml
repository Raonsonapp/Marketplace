name: Android Release Build

# Builds the Android RELEASE artifacts (AAB + APK) — never debug. Runs on
# every push to main that touches the mobile app (so a release build is
# always available to sanity-check), on version tags (the actual Play Store
# submission artifact), and on demand via workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-release.yml"
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    # The `secrets` context cannot be referenced directly inside a step's
    # `if:` condition — GitHub Actions rejects it at parse time ("Unrecognized
    # named-value: 'secrets'"), which is what made every run of this
    # workflow fail before a single job could start. Mirroring secrets into
    # job-level env here makes them readable from `env.*` in step `if:`
    # conditions, which IS supported.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      # Real upload-key signing (see docs/DEPLOYMENT.md). Without these
      # secrets set, android/app/build.gradle.kts falls back to debug
      # signing and logs a loud warning — the build still succeeds (so this
      # workflow is useful from day one) but that artifact must never be
      # uploaded to Google Play. Set the four ANDROID_KEYSTORE_* repository
      # secrets to get a real, Play-Store-ready signed release.
      - name: Write release keystore and key.properties
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Warn if building without a real signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — this build will be signed with the debug keystore and is NOT suitable for Google Play. See docs/DEPLOYMENT.md."

      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Build APK (release)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tajikshop-android-release
          path: |
            apps/mobile/build/app/outputs/bundle/release/*.aab
            apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
