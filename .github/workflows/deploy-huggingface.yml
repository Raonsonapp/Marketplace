name: Deploy to Hugging Face Spaces

# Auto-redeploys the live TajikShop API whenever backend code changes reach
# main. The Space's Dockerfile (infrastructure/huggingface/Dockerfile)
# clones this repo fresh at build time, so on every relevant push this job
# pushes that Dockerfile + README.md straight to the Space's own git repo
# with the current commit SHA baked into the Dockerfile's ARG SOURCE_COMMIT
# — that line's text differs on every deploy, which is what forces Docker
# to bust the cached git-clone layer and actually fetch the latest commit
# instead of silently reusing a stale one. See docs/HUGGINGFACE_DEPLOYMENT.md.
on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "infrastructure/huggingface/**"
      - ".github/workflows/deploy-huggingface.yml"
  workflow_dispatch: {}

env:
  # owner/space-name as shown in the Space's URL
  # (huggingface.co/spaces/<owner>/<space-name>).
  HF_SPACE: Mahmadmurodov/YouShop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the Space's Dockerfile with this commit's SHA baked in
        run: |
          mkdir -p /tmp/space-deploy
          sed "s/ARG SOURCE_COMMIT=dev/ARG SOURCE_COMMIT=${GITHUB_SHA}/" \
            infrastructure/huggingface/Dockerfile > /tmp/space-deploy/Dockerfile
          cp infrastructure/huggingface/README.md /tmp/space-deploy/README.md

      - name: Push to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN repository secret is not set. Create one at https://huggingface.co/settings/tokens (needs write access to the Space) and add it under Settings -> Secrets and variables -> Actions in this GitHub repo."
            exit 1
          fi
          cd /tmp/space-deploy
          git init -q -b main
          git config user.email "actions@github.com"
          git config user.name "TajikShop CI"
          git add Dockerfile README.md
          git commit -q -m "Deploy tajikshop/api @ ${GITHUB_SHA}"
          git push -f "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
