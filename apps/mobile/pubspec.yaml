name: tajikshop
description: "TajikShop — grocery delivery marketplace for Tajikistan."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^17.5.0

  # Networking
  dio: ^5.7.0

  # Models / codegen
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.4

  # Utilities
  intl: ^0.20.3
  collection: ^1.19.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^4.0.0
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
