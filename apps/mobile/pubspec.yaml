name: tajikshop
description: "TajikShop — grocery delivery marketplace for Tajikistan."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^17.5.0

  # Networking
  dio: ^5.7.0

  # Models / codegen
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Storage
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.4

  # Utilities
  intl: ^0.20.3
  collection: ^1.19.1
  uuid: ^4.5.1

  # Barcode / price scanner
  mobile_scanner: ^7.4.0
  permission_handler: ^11.3.1

  # Realtime order tracking
  web_socket_channel: ^3.0.1

  # Firebase Phone Auth (real SMS delivery — see docs/FIREBASE_SETUP.md)
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7

  # GPS + vendor-neutral map (OpenStreetMap tiles, no paid API key —
  # mirrors the backend's vendor-agnostic geo.Provider principle)
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^4.0.0
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/app_icon.png
  fonts:
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon_flattened.png"
  adaptive_icon_background: "#010B06"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  remove_alpha_ios: true
